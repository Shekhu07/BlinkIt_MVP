<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">

  <g transform="translate(15, 15)">
    <!-- Row 1 -->
    <rect x="0" y="0" width="20" height="20" rx="2" fill="none" stroke="#16130A" stroke-width="4"/>
    <rect x="25" y="0" width="20" height="20" rx="2" fill="#F8CD1B" stroke="#16130A" stroke-width="4"/>
    <rect x="50" y="0" width="20" height="20" rx="2" fill="none" stroke="#16130A" stroke-width="4"/>
    <!-- Row 2 -->
    <rect x="0" y="25" width="20" height="20" rx="2" fill="none" stroke="#16130A" stroke-width="4"/>
    <rect x="25" y="25" width="20" height="20" rx="2" fill="none" stroke="#16130A" stroke-width="4"/>
    <rect x="50" y="25" width="20" height="20" rx="2" fill="none" stroke="#16130A" stroke-width="4"/>
  </g>
  <!-- Magnifying Glass Overlay -->
  <g transform="translate(50, 50)">
    <circle cx="20" cy="20" r="12" fill="#F4F5F3" stroke="#16130A" stroke-width="4"/>
    <line x1="28.5" y1="28.5" x2="38" y2="38" stroke="#16130A" stroke-width="4" stroke-linecap="round"/>
  </g>
