<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect width="100" height="100" rx="12" fill="none"/>
  <!-- Delivery Box -->
  <g transform="translate(20, 25)">
    <!-- Main Box Frame -->
    <rect x="0" y="0" width="50" height="40" rx="2" fill="none" stroke="#16130A" stroke-width="4" stroke-linejoin="round"/>
    <!-- Box Flaps/Tape detail -->
    <line x1="0" y1="12" x2="50" y2="12" stroke="#16130A" stroke-width="4"/>
    <line x1="25" y1="0" x2="25" y2="12" stroke="#16130A" stroke-width="4"/>
  </g>
  <!-- Magnifying Glass Overlay -->
  <g transform="translate(50, 45)">
    <!-- Lens -->
    <circle cx="22" cy="22" r="14" fill="#F4F5F3" stroke="#16130A" stroke-width="4"/>
    <!-- Yellow Accented Handle -->
    <line x1="32" x2="42" y1="32" y2="42" stroke="#F8CD1B" stroke-width="6" stroke-linecap="round"/>
    <!-- Handle Outline for contrast -->
    <line x1="32" x2="42" y1="32" y2="42" fill="none" stroke="#16130A" stroke-width="1.5" stroke-linecap="round" transform="translate(0,0)"/>
  </g>
</svg>
